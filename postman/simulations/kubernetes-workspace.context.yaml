purpose:
  stands_in_for: A narrow synthetic Kubernetes API for workspace provisioning and UID/resourceVersion-guarded quota/PVC growth.
  unblocks: Testing real HTTP adapter calls and conflict handling without affecting the cluster.
assumptions:
  - id: capacity-growth
    status: supported
    claim: The capacity controller grows the existing claim after raising its quota and waits for an independent guest filesystem observation before activating rights.
    reason: The mock models storage class support and immediate Kubernetes capacity updates; the synthetic filesystem observation is separate. It does not establish real Longhorn or Kata expansion.
    verification: On 2026-11-03 test_capacity_simulation.py passed against the existing local Postman member. Its log captured 38 GET, two guarded PATCH and four provisioning POST requests. A separate test covers a lost patch response, stale identity and timeout/retry. CLI 1.74.0 supports simulation run but has no status command; no workspace sign-in or owner search was performed for this existing local mock.
    source: tests/test_capacity_simulation.py; tests/test_capacity.py; control_plane/capacity_controller.py
    updated_at: '2026-11-03'
  - id: create-only
    status: supported
    claim: Workspace objects use create-only POST operations; an existing name is a conflict and is never adopted.
    reason: The simulation intentionally models create and conflict; it is not proof of every real Kubernetes failure mode.
    verification: Local synthetic HTTP simulation and a separate real-cluster test of the journal creating and cleaning a synthetic retained volume on 2026-11-02. Failure injection against a live API remains unverified.
    source: https://kubernetes.io/docs/reference/kubernetes-api/core/persistent-volume-claim-v1/
    updated_at: '2026-11-02'
  - id: isolation-enforcement
    status: supported
    claim: NetworkPolicy declarations alone do not establish that traffic is isolated.
    reason: Enforcement depends on the cluster networking implementation and additional policies.
    verification: On 2026-11-02 two temporary Kata Pods confirmed baseline connectivity and that isolated ingress and egress each block the tested TCP connection; this does not cover all protocols or policy combinations.
    source: https://kubernetes.io/docs/concepts/services-networking/network-policies/
    updated_at: '2026-11-02'
  - id: volume-binding
    status: supported
    claim: The adapter reads a PV only after checking the recorded PVC identity, then records matching retained Longhorn storage identifiers.
    reason: The simulation tests HTTP integration; separate live testing exercised one synthetic volume and did not establish long-term storage health.
    verification: Local simulation and temporary real-cluster PVC/PV test on 2026-11-02; wrong identities and unreachable service covered by tests.
    source: scripts/test_workspace_kubernetes_simulation.py; scripts/workspace_provisioning_cluster_acceptance.py
    updated_at: '2026-11-02'
