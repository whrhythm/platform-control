[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-control-plane"
version = "0.1.0"
description = "Tenant and project control plane"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "alembic>=1.15,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
desktop = ["pyinstaller>=6,<7"]

[project.scripts]
platform-api = "control_plane.__main__:main"
platform-sidecar = "control_plane.sidecar:main"

[tool.setuptools.packages.find]
include = ["control_plane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

